name: sky-new

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: sky_new
      MYSQL_USER: sky
      MYSQL_PASSWORD: ${SKY_DB_PASSWORD:?Set SKY_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
      - type: bind
        source: ./sql/schema-mysql.sql
        target: /docker-entrypoint-initdb.d/01-schema.sql
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u"$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" > /dev/null']
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 12
    logging: *logging

  backend:
    image: ghcr.io/zaina01/sky-new:${BACKEND_TAG:-latest}
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SKY_DB_URL: jdbc:mysql://mysql:3306/sky_new?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SKY_DB_USERNAME: sky
      SKY_DB_PASSWORD: ${SKY_DB_PASSWORD:?Set SKY_DB_PASSWORD in .env}
      SKY_JWT_SECRET: ${SKY_JWT_SECRET:?Set SKY_JWT_SECRET in .env (at least 32 bytes)}
      SKY_PLUGIN_JAVA_COMMAND: /opt/java/openjdk/bin/java
      SKY_PLUGIN_RUNNER_JAR: /app/runner.jar
      SKY_PLUGIN_STORAGE_ROOT: /app/data/plugins
      SKY_PLUGIN_ARTIFACT_ROOT: /app/data/plugins/artifacts
      SKY_PLUGIN_RUNTIME_WORK_ROOT: /app/data/plugins/runtime
      SKY_PLUGIN_RUNTIME_LOG_ROOT: /app/data/plugins/logs
      SKY_PLUGIN_MAVEN_REPOSITORY_ROOT: /app/data/plugins/maven-repository
      SKY_PLUGIN_MAX_HEAP: ${SKY_PLUGIN_MAX_HEAP:-256m}
      JAVA_TOOL_OPTIONS: ${SKY_JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=50.0}
    volumes:
      - plugin-data:/app/data/plugins
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, http://127.0.0.1:8080/api/actuator/health]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 5
    logging: *logging

  web:
    image: ghcr.io/zaina01/sky-vue-new:${FRONTEND_TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${SKY_HTTP_BIND:-0.0.0.0}:${SKY_HTTP_PORT:-80}:80"
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/healthz]
      interval: 15s
      timeout: 5s
      retries: 3
    logging: *logging

volumes:
  mysql-data:
  plugin-data:
