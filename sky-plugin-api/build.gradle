plugins {
    id 'java-library'
    id 'maven-publish'
}

dependencies {
    api project(':sky-plugin-protocol')
    api "org.slf4j:slf4j-api:${rootProject.ext.slf4jVersion}"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'sky-plugin-api'
        }
    }
}
