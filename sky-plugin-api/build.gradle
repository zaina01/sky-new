plugins {
    id 'java-library'
    id 'com.vanniktech.maven.publish'
}

description = 'Public Java API and annotations for Sky plugins.'
apply from: rootProject.file('gradle/sdk-publishing.gradle')

dependencies {
    api project(':sky-plugin-protocol')
    api "org.slf4j:slf4j-api:${rootProject.ext.slf4jVersion}"
}
