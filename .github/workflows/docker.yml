name: Container images

on:
  pull_request:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sky-plugin-runner-node/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sky-plugin-runner-python/requirements*.txt
      - name: Unit tests and standalone plugin fixture
        run: bash ./gradlew --no-daemon test :sky-job:frontendIntegrationPluginJar
      - name: Native Runner unit and gRPC protocol checks
        run: |
          npm --prefix sky-plugin-runner-node ci --no-audit --no-fund
          npm --prefix sky-plugin-runner-node run build
          npm --prefix sky-plugin-runner-node test
          python -m venv build/runner-tests
          build/runner-tests/bin/python -m pip install -r sky-plugin-runner-python/requirements-build.txt
          build/runner-tests/bin/python sky-plugin-runner-python/generate.py
          build/runner-tests/bin/python scripts/test-native-runners.py
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-plugin
          path: sky-job/build/fixtures/frontend-integration-plugin.jar
          if-no-files-found: error
      - name: Validate deployment configuration
        env:
          SKY_DB_PASSWORD: ci-only-database-password
          MYSQL_ROOT_PASSWORD: ci-only-root-password
          SKY_JWT_SECRET: ci-only-jwt-secret-at-least-thirty-two-bytes
        run: |
          export SKY_SCRIPT_ENV_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          bash scripts/validate-deployment-config.sh

  image:
    needs: checks
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: smoke-plugin
          path: build/smoke
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.multilang
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: sky-backend:ci
          cache-from: type=gha,scope=backend-multilang-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=backend-multilang-${{ matrix.arch }}
      - name: Java, Node and Python container smoke test
        run: bash scripts/docker-smoke.sh sky-backend:ci build/smoke/frontend-integration-plugin.jar
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested architecture
        if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
        env:
          IMAGE: ghcr.io/zaina01/sky-new
          ARCH: ${{ matrix.arch }}
        run: |
          docker tag sky-backend:ci "$IMAGE:sha-$GITHUB_SHA-$ARCH"
          docker push "$IMAGE:sha-$GITHUB_SHA-$ARCH"

  publish:
    needs: image
    if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform tags
        env:
          IMAGE: ghcr.io/zaina01/sky-new
        run: |
          tags=(--tag "$IMAGE:sha-$GITHUB_SHA")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tags+=(--tag "$IMAGE:$GITHUB_REF_NAME")
          else
            tags+=(--tag "$IMAGE:latest")
          fi
          docker buildx imagetools create "${tags[@]}" \
            "$IMAGE:sha-$GITHUB_SHA-amd64" "$IMAGE:sha-$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA"
