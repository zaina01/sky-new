pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
    }
}

rootProject.name = 'sky-new'

include 'sky-plugin-protocol'
include 'sky-plugin-api'
include 'sky-plugin-runner-java'
include 'sky-job'
include 'plugin-demo'
